name: "Conventional commits"
description: "Check every commit in the pull request with commitlint"
inputs:
  from:
    description: "The base commit"
    required: true
  to:
    description: "The head commit"
    required: true
runs:
  using: composite
  steps:
    - name: Lint commit messages
      shell: bash
      env:
        FROM: ${{ inputs.from }}
        TO: ${{ inputs.to }}
      run: pnpm exec commitlint --from "$FROM" --to "$TO" --verbose

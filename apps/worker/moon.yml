$schema: "../../node_modules/@moonrepo/cli/schemas/project.json"

layer: "application"
language: "typescript"

dependsOn:
  - "shared"

fileGroups:
  # The shared renderer is source code in this project's build: a change
  # there must invalidate this project's cached results.
  sources:
    - "**/*"
    - "/packages/shared/src/**/*"
    - "/packages/shared/package.json"
    - "/tsconfig.base.json"

tasks:
  dev:
    command: "pnpm exec wrangler dev"
    preset: "server"
  lint:
    command: "pnpm exec biome check ."
  format:
    command: "pnpm exec biome format --write ."
    options:
      cache: false
  typecheck:
    script: "pnpm exec wrangler types --check && pnpm exec tsc -p tsconfig.json"
    inputs:
      - "@group(sources)"
  test:
    command: "pnpm exec vitest run"
    inputs:
      - "@group(sources)"
  build:
    command: "pnpm exec wrangler deploy --dry-run --outdir dist"
    inputs:
      - "@group(sources)"
    outputs:
      - "dist"
